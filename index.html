<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Housekeeping Needs</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12303a;--bg:#f6fbfa;--teal:#0e7c86;--teal-d:#0a5c64;--soap:#dff2f3;--lemon:#f6d54a;--line:#cfe3e4;--wa:#1faa59}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Mukta,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;padding-bottom:84px}
header{background:var(--teal);color:#fff;padding:28px 18px 34px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--lemon);opacity:.9}
header::before{content:"";position:absolute;right:60px;top:70px;width:70px;height:70px;border-radius:50%;background:var(--soap);opacity:.35}
.wrap{max-width:980px;margin:0 auto;position:relative;z-index:1}
h1{margin:0 0 6px;font-size:2rem;font-weight:800;line-height:1.15;max-width:15ch}
header p{margin:0;max-width:34ch;opacity:.95}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
input,textarea{font:inherit;color:var(--ink);width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--lemon);outline-offset:1px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cats button{flex:none;font:inherit;font-weight:600;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pic{height:96px;border-radius:10px;background:var(--soap);display:grid;place-items:center;font-size:3rem}
.card h3{margin:4px 0 0;font-size:1.05rem;line-height:1.3}
.size{font-size:.9rem;color:#4b6b73}
.price{font-weight:800;font-size:1.25rem;margin-top:auto}
.add{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px;background:var(--teal);color:#fff;cursor:pointer}
.add:active{background:var(--teal-d)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--soap);border-radius:10px;padding:4px}
.qty button{font:inherit;font-weight:800;width:40px;height:36px;border:0;border-radius:8px;background:#fff;color:var(--ink);font-size:1.2rem;cursor:pointer}
.qty span{font-weight:800}
.empty{text-align:center;padding:40px 0;color:#4b6b73}
.cartbtn{position:fixed;left:14px;right:14px;bottom:14px;z-index:8;max-width:600px;margin:0 auto;display:none;justify-content:space-between;align-items:center;padding:14px 18px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(18,48,58,.3)}
.cartbtn.show{display:flex}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(18,48,58,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 24px}
.panel h2{margin:0 0 10px;font-size:1.4rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:#4b6b73}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;padding:12px 0}
label{display:block;font-weight:600;margin:10px 0 4px}
.send{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:var(--wa);color:#fff;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.close{float:right;font:inherit;border:0;background:var(--soap);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.note{font-size:.9rem;color:#4b6b73;margin-top:8px}
footer{text-align:center;padding:10px 18px 30px;color:#4b6b73;font-size:.95rem}
@media(min-width:700px){.bar .wrap{flex-direction:row;align-items:center}.bar input{max-width:280px}h1{font-size:2.6rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header><div class="wrap">
  <h1 id="shopName">All Housekeeping Needs</h1>
  <p>Cleaning supplies for home and shop. Order on WhatsApp and we will deliver to your door.</p>
</div></header>

<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Search items, e.g. Phenyl, Broom" aria-label="Search items">
  <div class="cats" id="cats"></div>
</div></div>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No items found. Try another name.</div>
</div></main>

<footer id="foot"></footer>

<button class="cartbtn" id="cartbtn"><span id="cnt"></span><span>View Order</span><span id="tot"></span></button>

<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-label="Your order">
  <button class="close" id="close">Close</button>
  <h2>Your Order</h2>
  <div id="lines"></div>
  <div class="total"><span>Total</span><span id="sum"></span></div>
  <label for="name">Your name</label>
  <input id="name" autocomplete="name">
  <label for="addr">Full address</label>
  <textarea id="addr" rows="3" autocomplete="street-address"></textarea>
  <button class="send" id="send">Send Order on WhatsApp</button>
  <p class="note">When you tap the button, WhatsApp will open with your order already written. Just press send.</p>
</div></div>

<script>
/* ====== यहाँ अपनी जानकारी बदलें ====== */
const SHOP_NAME = "All Housekeeping Needs";      // अपनी दुकान का नाम
const WHATSAPP  = "918910887584";            // अपना नंबर: 91 के साथ, बिना + या खाली जगह के
const DELIVERY_NOTE = "Free delivery on orders above ₹500";   // खाली छोड़ सकते हैं: ""

// हर सामान: id, नाम, साइज़/मात्रा, दाम (₹), कैटेगरी, इमोजी
// पहले 4 सामान आपकी पुरानी साइट से हैं। बाकी उदाहरण हैं, अपने असली सामान और दाम लिखें।
const PRODUCTS = [
  {id:1, n:"Floor Cleaner",     s:"1 Litre",  p:120, c:"Floor", e:"🧴"},
  {id:2, n:"Phenyl",            s:"1 Litre",  p:120, c:"Floor", e:"🧴"},
  {id:3, n:"Floor Mop",         s:"1 pc",     p:250, c:"Floor", e:"🧹"},
  {id:4, n:"Broom",             s:"1 pc",     p:80,  c:"Floor", e:"🧹"},
  {id:5, n:"Toilet Cleaner",    s:"500 ml",   p:99,  c:"Bathroom", e:"🚽"},
  {id:6, n:"Hand Wash",         s:"250 ml",   p:75,  c:"Bathroom", e:"🧼"},
  {id:7, n:"Bathroom Brush",    s:"1 pc",     p:60,  c:"Bathroom", e:"🪥"},
  {id:8, n:"Dishwash Liquid",   s:"500 ml",   p:110, c:"Kitchen", e:"🍽️"},
  {id:9, n:"Scrub Pad",         s:"Pack of 3", p:45, c:"Kitchen", e:"🧽"},
  {id:10,n:"Detergent Powder",  s:"1 kg",     p:130, c:"Clothes", e:"👕"},
  {id:11,n:"Microfibre Cloth",  s:"Pack of 2", p:99, c:"Cleaning", e:"🧻"},
  {id:12,n:"Garbage Bags",      s:"30 pcs",   p:85,  c:"Cleaning", e:"🗑️"}
];
/* ====== बस इतना ही। इसके नीचे कुछ न बदलें ====== */

const $ = id => document.getElementById(id);
const rs = n => "₹" + n.toLocaleString("en-IN");
let cart = {}, cat = "All", term = "";

try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e) { cart = {}; }
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e) {} };

document.title = SHOP_NAME;
$("shopName").textContent = SHOP_NAME;
$("foot").textContent = DELIVERY_NOTE;

const CATS = ["All", ...new Set(PRODUCTS.map(p => p.c))];
$("cats").innerHTML = CATS.map(c => `<button data-c="${c}" class="${c===cat?"on":""}">${c}</button>`).join("");
$("cats").onclick = e => { const c = e.target.dataset.c; if(!c) return; cat = c;
  [...$("cats").children].forEach(b => b.classList.toggle("on", b.dataset.c===cat)); draw(); };
$("q").oninput = e => { term = e.target.value.trim().toLowerCase(); draw(); };

function draw(){
  const list = PRODUCTS.filter(p => (cat==="All"||p.c===cat) && (p.n+p.s).toLowerCase().includes(term));
  $("empty").hidden = list.length > 0;
  $("grid").innerHTML = list.map(p => {
    const q = cart[p.id] || 0;
    const ctl = q
      ? `<div class="qty"><button data-m="${p.id}" aria-label="Decrease">−</button><span>${q}</span><button data-a="${p.id}" aria-label="Increase">+</button></div>`
      : `<button class="add" data-a="${p.id}">Add</button>`;
    return `<div class="card"><div class="pic">${p.e}</div><h3>${p.n}</h3><div class="size">${p.s}</div><div class="price">${rs(p.p)}</div>${ctl}</div>`;
  }).join("");
  bar();
}
function change(id, d){
  cart[id] = Math.max(0, (cart[id]||0) + d);
  if(!cart[id]) delete cart[id];
  save(); draw(); if($("sheet").classList.contains("open")) lines();
}
$("grid").onclick = e => { const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.a) change(+b.dataset.a, 1); if(b.dataset.m) change(+b.dataset.m, -1); };

function totals(){
  let n = 0, t = 0;
  for(const id in cart){ const p = PRODUCTS.find(x => x.id==id); if(p){ n += cart[id]; t += cart[id]*p.p; } }
  return {n, t};
}
function bar(){
  const {n, t} = totals();
  $("cartbtn").classList.toggle("show", n > 0);
  $("cnt").textContent = n + (n === 1 ? " item" : " items"); $("tot").textContent = rs(t);
}
function lines(){
  $("lines").innerHTML = Object.keys(cart).map(id => {
    const p = PRODUCTS.find(x => x.id==id);
    return `<div class="row"><div>${p.n}<small>${p.s} × ${cart[id]}</small></div><div>${rs(p.p*cart[id])}</div></div>`;
  }).join("");
  $("sum").textContent = rs(totals().t);
  if(!totals().n) $("sheet").classList.remove("open");
}
$("cartbtn").onclick = () => { lines(); $("sheet").classList.add("open"); };
$("close").onclick = () => $("sheet").classList.remove("open");
$("sheet").onclick = e => { if(e.target.id==="sheet") $("sheet").classList.remove("open"); };

$("send").onclick = () => {
  const name = $("name").value.trim(), addr = $("addr").value.trim();
  if(!name){ $("name").focus(); return alert("Please enter your name"); }
  if(!addr){ $("addr").focus(); return alert("Please enter your address"); }
  let m = `Hello, I would like to order these items:\n\n`;
  let i = 1;
  for(const id in cart){ const p = PRODUCTS.find(x => x.id==id);
    m += `${i++}. ${p.n} (${p.s}) × ${cart[id]} = ${rs(p.p*cart[id])}\n`; }
  m += `\nTotal: ${rs(totals().t)}\n\nName: ${name}\nAddress: ${addr}`;
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(m), "_blank");
};
draw();
</script>
</body>
</html>
